# wayland-osk configuration. Copy to ~/.config/wayland-osk/config.ini and edit.
# Every setting is optional; the values below are the defaults.
# A comment after a value starts with "# " (with the space, since "#" also starts a
# colour code).

[keyboard]
# Labels of the keys. This has to be the keyboard layout your system uses:
#   de   German, QWERTZ
#   us   US English, QWERTY
layout = de

[trigger]
# Mouse button that shows and hides the keyboard. Common names:
#   BTN_MIDDLE   wheel click
#   BTN_SIDE     thumb button, usually "back"
#   BTN_EXTRA    thumb button, usually "forward"
# Run "wayland-osk-listener --detect" and press a button to see what it is called.
button = BTN_MIDDLE

# Only listen to devices whose name contains this text. Empty means every mouse.
# "wayland-osk-listener --list" shows the names.
device =

[style]
# Font of the key labels: the family name as fc-list shows it, e.g. "DejaVu Sans Mono".
# "fc-list : family" lists the installed ones. Empty means the font of your desktop.
font =
# Size of the key labels in pixels.
font_size = 13

# Colours as codes like #31363b. CSS colour names such as "white" work as well.
background = #232629    # behind the keys
key = #31363b           # key
text = #eff0f1          # key label
border = #4d4d4d        # frame around each key
hover = #3daee9         # key under the mouse pointer
hover_text = #ffffff    # its label
active = #1d99f3        # Shift or AltGr while switched on
active_text = #ffffff   # its label
