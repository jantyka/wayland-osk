# wayland-osk configuration. Copy to ~/.config/wayland-osk/config.ini and edit.
# Every setting is optional; the values below are the defaults.

[keyboard]
# Labels of the keys. This has to be the keyboard layout your system uses:
#   de   German, QWERTZ
#   us   US English, QWERTY
layout = de

[trigger]
# Mouse button that shows and hides the keyboard. Common names:
#   BTN_MIDDLE   wheel click
#   BTN_SIDE     thumb button, usually "back"
#   BTN_EXTRA    thumb button, usually "forward"
# Run "wayland-osk-listener --detect" and press a button to see what it is called.
button = BTN_MIDDLE

# Only listen to devices whose name contains this text. Empty means every mouse.
# "wayland-osk-listener --list" shows the names.
device =
